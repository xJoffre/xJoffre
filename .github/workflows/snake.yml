name: snake

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#14B8A6&color_dots=#ebedf0,#d9d1fa,#9b7bf2,#6c4fe0,#4b32b8
            dist/snake-dark.svg?palette=github-dark&color_snake=#14B8A6&color_dots=#161b22,#2e2a5c,#4b32b8,#6c4fe0,#9b7bf2
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
